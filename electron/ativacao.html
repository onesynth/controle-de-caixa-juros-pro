<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ativação — Controle de Caixa & Juros Pro</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background: linear-gradient(135deg,#6c3ce0,#2563eb); }
  .caixa { background:#fff; border-radius:16px; padding:36px 40px; width:420px;
           box-shadow:0 10px 40px rgba(0,0,0,.25); text-align:center; }
  h1 { font-size:20px; color:#2c3e50; margin:0 0 4px; }
  p.sub { color:#7f8c8d; font-size:13px; margin:0 0 22px; }
  input { width:100%; padding:12px 14px; border:1px solid #ccc; border-radius:10px;
          font-size:16px; text-align:center; letter-spacing:2px; text-transform:uppercase; }
  input:focus { outline:2px solid #6c3ce0; border-color:transparent; }
  button { width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px;
           background:#6c3ce0; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button:disabled { background:#95a5a6; cursor:wait; }
  .erro { color:#c0392b; font-size:13px; min-height:18px; margin-top:10px; }
  .logo { width:64px; height:64px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="caixa">
    <svg class="logo" viewBox="0 0 256 256"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c3ce0"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="256" height="256" rx="56" fill="url(#g)"/><circle cx="128" cy="128" r="72" fill="none" stroke="#fff" stroke-width="14"/><text x="128" y="148" text-anchor="middle" font-size="72" font-weight="700" fill="#fff" font-family="sans-serif">%</text></svg>
    <h1>Controle de Caixa & Juros Pro</h1>
    <p class="sub" id="sub">Digite a chave de licença recebida por e-mail para ativar o aplicativo.</p>
    <input id="chave" placeholder="CCJ-XXXX-XXXX-XXXX" maxlength="19" autofocus>
    <button id="btn" onclick="ativar()">Ativar licença</button>
    <div class="erro" id="erro"></div>
  </div>
<script>
  const { ipcRenderer } = require('electron')
  const $ = id => document.getElementById(id)
  const params = new URLSearchParams(location.search)
  if (params.get('modo') === 'bloqueado') {
    $('sub').textContent = 'Sua licença precisa ser revalidada. Conecte-se à internet e clique em Revalidar.'
    $('btn').textContent = 'Revalidar licença'
    $('chave').value = params.get('chave') || ''
    $('chave').readOnly = true
  }
  async function ativar() {
    $('erro').textContent = ''
    $('btn').disabled = true
    $('btn').textContent = 'Verificando...'
    try {
      const modo = params.get('modo')
      const r = await ipcRenderer.invoke(modo === 'bloqueado' ? 'revalidar-licenca' : 'ativar-licenca', $('chave').value)
      if (r.ok) { window.close(); return }
      $('erro').textContent = r.erro || 'Não foi possível ativar. Verifique sua conexão.'
    } catch (e) {
      $('erro').textContent = 'Falha de conexão com o servidor de licenças. Verifique sua internet.'
    }
    $('btn').disabled = false
    $('btn').textContent = params.get('modo') === 'bloqueado' ? 'Revalidar licença' : 'Ativar licença'
  }
  $('chave').addEventListener('keydown', e => { if (e.key === 'Enter') ativar() })
</script>
</body>
</html>
